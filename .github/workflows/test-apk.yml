name: Build test APK

on:
  push:
    branches-ignore:
      - main
  workflow_dispatch:

concurrency:
  group: test-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          java-version: 17
          distribution: "temurin"

      - uses: FossifyOrg/.github/.github/actions/gradle-cache@main

      - name: Build debug APK
        run: ./gradlew assembleFossDebug

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: "calendar-test-apk"
          path: "app/build/outputs/apk/foss/debug/*debug.apk"
